apiVersion: v1
kind: Secret
metadata:
  name: sumo-k8-secrets
  namespace: sumo-k8
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@postgres-service:5432/sumo_k8"
  # Optional: must match PLAN Django WEBHOOK_SHARED_TOKEN or progress webhooks return 403.
  # WEBHOOK_SHARED_TOKEN: "paste-same-as-plan"

# kubectl create secret generic sumo-k8-secrets \
#   --from-literal=DATABASE_URL="postgresql://user:pass@host:5432/sumo_k8" \
#   --from-literal=WEBHOOK_SHARED_TOKEN="<same as PLAN WEBHOOK_SHARED_TOKEN>" \
#   -n sumo-k8
