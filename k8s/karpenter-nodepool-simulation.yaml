apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: simulation-nodes
spec:
  disruption:
    # Keep the existing behavior: scale back down when empty.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 60s
    budgets:
    - nodes: 10%
  # Cap pool growth. Raised so a full multi-seed fan-out (one sim per node, ~16-48 vCPU
  # each) never starves on the pool limit, with headroom for concurrent PLAN sims.
  limits:
    cpu: "1024"
    memory: 2048Gi
  template:
    metadata:
      labels:
        node-type: simulation
        workload-type: simulation
    spec:
      expireAfter: 12h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: simulation-nodeclass
      requirements:
      - key: kubernetes.io/arch
        operator: In
        values: ["amd64"]
      - key: kubernetes.io/os
        operator: In
        values: ["linux"]
      - key: topology.kubernetes.io/zone
        operator: In
        values: ["eu-central-2c", "eu-central-2a", "eu-central-2b"]
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]
      # Keep the instance pool as BROAD as possible so a full multi-seed fan-out
      # never starves on insufficient-capacity (ICE) for a single instance type —
      # eu-central-2 has only 3 AZs, so type diversity is the main availability lever.
      # One sim per node is still enforced by pod anti-affinity (sumo-heavy), so a
      # larger node just means more spare headroom, never a second sim.
      - key: karpenter.k8s.aws/instance-category
        operator: In
        values: ["c", "m", "r"]
      - key: karpenter.k8s.aws/instance-generation
        operator: Gt
        values: ["5"]
      # Floor at >16 vCPU so the smallest eligible node (8xlarge = 32 vCPU, ~31.85
      # allocatable) comfortably fits a 16 vCPU / 32Gi pod after system reservations.
      # Karpenter bin-packs each pod onto the smallest node that fits, so larger
      # CPU requests still land on 12xlarge+; this only ADDS smaller/cheaper options.
      - key: karpenter.k8s.aws/instance-cpu
        operator: Gt
        values: ["16"]
      - key: karpenter.k8s.aws/instance-size
        operator: In
        values: ["8xlarge", "9xlarge", "12xlarge", "16xlarge", "24xlarge", "48xlarge"]
